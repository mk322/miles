# Datagen-parity variant of terminus2_local_docker.yaml: identical except for
# `datagen_parity: true` and `proactive_summarization_threshold: 8000` (needs the
# harbor-marin `datagen-parity` branch). See README_parity.md.
# Local-Docker port of OpenThoughts-Agent's eval config
# (OpenThoughts-Agent/hpc/harbor_yaml/eval/configs/dcagent_eval_config_no_override.yaml).
# Differences from upstream, all forced by running on one box instead of Daytona:
#   environment.type daytona -> docker; force_build/delete false so task images are
#   cached across the 3 attempts (containers are still removed by `compose down`).
# model_name / api_base / metrics_endpoint are filled in by run_eval.sh.
n_attempts: 3
timeout_multiplier: 2.0
orchestrator:
  type: local
  n_concurrent_trials: 32
  quiet: true
  plain_output: true
  retry:
    max_retries: 10
    exclude_exceptions:
      - AgentTimeoutError
      - AgentEnvironmentTimeoutError
      - BadRequestError
      - VerifierTimeoutError
      - SummarizationTimeout
      - SummarizationTimeoutError
      - ContextLengthExceededError
    wait_multiplier: 1.0
    min_wait_sec: 1.0
    max_wait_sec: 60.0
environment:
  type: docker
  force_build: false
  delete: false
verifier:
  max_timeout_sec: 14400
agents:
  - name: terminus-2
    model_name: hosted_vllm/Qwen/Qwen3-8B
    max_timeout_sec: 7200
    trajectory_config:
      raw_content: true
      linear_history: true
    kwargs:
      record_terminal_session: false
      enable_episode_logging: false
      enable_pane_logging: false
      collect_rollout_details: false
      collect_engine_metrics: false
      # Datagen parity (see README_parity.md): prompts byte-identical to the
      # 2026-04 terminus-2 harness that generated OpenThoughts-Agent-SFT-10K, and
      # the summarization trigger it used (default 8000 free tokens, not 2048).
      datagen_parity: true
      proactive_summarization_threshold: 8000
      metrics_endpoint: http://localhost:8000/metrics
      metrics_timeout_sec: 10
      max_tokens: 16384
      llm_kwargs:
        timeout: 1800
      model_info:
        max_input_tokens: 32768
        max_output_tokens: 16384
        input_cost_per_token: 0
        output_cost_per_token: 0
